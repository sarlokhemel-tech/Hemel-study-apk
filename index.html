<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Preview</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Header */
        .chat-header {
            padding: 15px;
            background: #0084ff;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e4e6eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #0084ff;
        }

        .user-info h3 {
            font-size: 16px;
        }

        .user-info span {
            font-size: 12px;
            opacity: 0.8;
        }

        /* Messages Area */
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f9f9f9;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.incoming {
            background: #e4e6eb;
            color: #050505;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.outgoing {
            background: #0084ff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        /* Input Area */
        .chat-input {
            padding: 10px;
            display: flex;
            gap: 8px;
            background: #fff;
            border-top: 1px solid #ddd;
        }

        .chat-input input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .chat-input button {
            padding: 10px 18px;
            background: #0084ff;
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-input button:active {
            background: #0066cc;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="avatar">AI</div>
            <div class="user-info">
                <h3>Test Bot</h3>
                <span>Online</span>
            </div>
        </div>

        <!-- Messages Area -->
        <div class="chat-messages" id="messageBox">
            <div class="message incoming">
                হ্যালো! Hopweb-এ আপনার মেসেঞ্জারে স্বাগতম। কিছু লিখে টেস্ট করুন!
            </div>
        </div>

        <!-- Input Box -->
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="মেসেজ লিখুন..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const messageText = input.value.trim();

            if (messageText === '') return;

            // Add Outgoing Message
            appendMessage(messageText, 'outgoing');
            input.value = '';

            // Auto Reply (Simulated Chatbot response)
            setTimeout(() => {
                const replies = [
                    "আপনার মেসেজটি পেয়েছি!",
                    "Hopweb-এ কোডটি দারুণ কাজ করছে!",
                    "এটি একটি লোকাল ফ্রন্ট-এন্ড রেসপন্স।",
                    "চমৎকার! আপনি সফলভাবে টেস্ট করেছেন।"
                ];
                const randomReply = replies[Math.floor(Math.random() * replies.length)];
                appendMessage(randomReply, 'incoming');
            }, 1000);
        }

        function appendMessage(text, type) {
            const messageBox = document.getElementById('messageBox');
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', type);
            messageDiv.innerText = text;

            messageBox.appendChild(messageDiv);
            messageBox.scrollTop = messageBox.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
</html>
