name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libffi-dev \
          libssl-dev \
          libjpeg-dev \
          zlib1g-dev \
          autoconf \
          libtool \
          pkg-config \
          git \
          curl \
          wget \
          unzip \
          openjdk-11-jdk \
          ccache \
          libncurses5 \
          libncurses5-dev \
          libncursesw5 \
          libncursesw5-dev \
          libxinerama-dev \
          libxinerama1 \
          libxrandr-dev \
          libxrandr2 \
          libxss-dev \
          libxss1 \
          libxtst-dev \
          libxtst6 \
          libxv-dev \
          libxv1 \
          libxxf86dga-dev \
          libxxf86dga1 \
          libxxf86vm-dev \
          libxxf86vm1 \
          x11-utils \
          xauth \
          xvfb

    - name: Set JAVA_HOME
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> $GITHUB_ENV
        echo "PATH=/usr/lib/jvm/java-11-openjdk-amd64/bin:$PATH" >> $GITHUB_ENV

    - name: Verify Java installation
      run: |
        java -version
        javac -version

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install cython==0.29.36

    - name: Setup Android SDK
      run: |
        mkdir -p $HOME/android-sdk
        cd $HOME/android-sdk
        
        # Download Android SDK command-line tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip
        rm commandlinetools-linux-9477386_latest.zip
        
        # Move to proper location
        mkdir -p tools
        mv cmdline-tools/* tools/
        
        # Set SDK root
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/tools/bin:$ANDROID_SDK_ROOT/platform-tools
        
        # Accept licenses
        yes | sdkmanager --licenses || true
        
        # Install SDK components
        sdkmanager --no_https "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true

    - name: Setup Android NDK
      run: |
        mkdir -p $HOME/android-ndk
        cd $HOME/android-ndk
        
        # Download NDK
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip
        rm android-ndk-r25b-linux.zip

    - name: Set Android environment variables
      run: |
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$HOME/android-ndk/android-ndk-r25b" >> $GITHUB_ENV
        echo "PATH=$HOME/android-sdk/tools/bin:$HOME/android-sdk/platform-tools:$PATH" >> $GITHUB_ENV

    - name: Verify Android SDK
      run: |
        which sdkmanager
        which adb

    - name: Create Buildozer build directory
      run: |
        mkdir -p .buildozer
        mkdir -p bin

    - name: Cache Buildozer files
      uses: actions/cache@v3
      with:
        path: .buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: Cache Gradle
      uses: actions/cache@v3
      with:
        path: ~/.gradle
        key: gradle-${{ runner.os }}-${{ hashFiles('build.gradle') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Build APK with Buildozer
      run: |
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export ANDROID_NDK_ROOT=$HOME/android-ndk/android-ndk-r25b
        export PATH=$HOME/android-sdk/tools/bin:$HOME/android-sdk/platform-tools:$PATH
        
        buildozer android release
      timeout-minutes: 90

    - name: Check APK generation
      run: |
        ls -lah bin/ || true
        find . -name "*.apk" -type f

    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Hemel-Study-AI-APK
        path: bin/*.apk
        retention-days: 30

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: .buildozer/android/platform/build-*/build/outputs/
        retention-days: 7

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build status notification
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "✅ APK Build Successful!"
          echo "APK Location: bin/*.apk"
        else
          echo "❌ APK Build Failed"
          echo "Check logs for details"
        fi
